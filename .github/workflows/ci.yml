name: CI

on:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install Android SDK
        run: |
          set -euo pipefail
          mkdir -p "$HOME/android-sdk/cmdline-tools"
          curl -fsSL -o /tmp/cmdtools.zip https://dl.google.com/android/repository/commandlinetools-linux-15859902_latest.zip
          unzip -q /tmp/cmdtools.zip -d "$HOME/android-sdk/cmdline-tools"
          mv "$HOME/android-sdk/cmdline-tools/cmdline-tools" "$HOME/android-sdk/cmdline-tools/latest"
          echo "ANDROID_HOME=$HOME/android-sdk" >> "$GITHUB_ENV"
          echo "$HOME/android-sdk/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$HOME/android-sdk/platform-tools" >> "$GITHUB_PATH"
          sdkmanager="$HOME/android-sdk/cmdline-tools/latest/bin/sdkmanager"
          # sdkmanager closes stdin when the licenses are accepted, so `yes` exits
          # with SIGPIPE. pipefail would fail the step on that.
          set +o pipefail
          yes | "$sdkmanager" --sdk_root="$HOME/android-sdk" --licenses >/dev/null || true
          set -o pipefail
          "$sdkmanager" --sdk_root="$HOME/android-sdk" "platforms;android-36" "build-tools;36.0.0"

      - name: Build, test and lint
        run: ./gradlew assembleDebug testDebugUnitTest lintDebug
